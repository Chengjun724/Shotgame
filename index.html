<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Shotgame</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }

    /* --- Blocker (startmeny + paus) --- */
    #blocker {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.82);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: white; z-index: 10;
    }
    #blocker.hidden { display: none; }

    /* Startmeny */
    #start-menu { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    #start-menu h1 { font-size: 76px; letter-spacing: 8px; text-shadow: 0 0 30px rgba(255,100,100,0.6); }
    #start-menu .subtitle { font-size: 17px; color: #aaa; margin-bottom: 6px; }
    .controls-grid {
      display: grid; grid-template-columns: auto auto;
      gap: 6px 28px; font-size: 15px; color: #ccc;
      margin-bottom: 10px;
    }
    .controls-grid span { color: #ffcc44; font-weight: bold; }
    #start-btn {
      font-size: 22px; padding: 16px 52px;
      background: #22aa44; color: white;
      border: none; cursor: pointer; border-radius: 8px;
      letter-spacing: 2px; font-weight: bold;
      transition: background 0.15s;
    }
    #start-btn:hover { background: #1a8838; }

    /* Pausmeny */
    #pause-menu { display: flex; flex-direction: column; align-items: center; gap: 12px; cursor: pointer; }
    #pause-menu h2 { font-size: 48px; letter-spacing: 4px; }
    #pause-menu p  { font-size: 18px; color: #aaa; }
    #pause-menu.hidden { display: none; }

    /* --- Crosshair --- */
    #crosshair {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none; z-index: 5;
    }
    #crosshair::before {
      content: ''; position: absolute;
      width: 2px; height: 16px;
      background: white; top: -8px; left: -1px;
    }
    #crosshair::after {
      content: ''; position: absolute;
      width: 16px; height: 2px;
      background: white; top: -1px; left: -8px;
    }

    /* --- HUD --- */
    #hud {
      position: fixed; top: 20px; left: 20px;
      color: white; font-size: 18px;
      text-shadow: 1px 1px 3px black;
      pointer-events: none; z-index: 5;
    }

    #timer {
      position: fixed; top: 20px; left: 50%;
      transform: translateX(-50%);
      color: white; font-size: 26px; font-weight: bold;
      text-shadow: 1px 1px 4px black;
      pointer-events: none; z-index: 5;
      letter-spacing: 2px;
    }

    #bottom-right {
      position: fixed; bottom: 24px; right: 24px;
      display: flex; gap: 24px; align-items: center;
      pointer-events: none; z-index: 5;
    }
    #hp-display {
      color: white; font-size: 22px; font-weight: bold;
      text-shadow: 1px 1px 4px black;
    }
    #ammo-display {
      color: white; font-size: 22px; font-weight: bold;
      text-shadow: 1px 1px 4px black;
    }
    #ammo-display.reloading { color: #ffcc44; }

    /* --- Skade-blink --- */
    #damage-flash {
      position: fixed; inset: 0;
      background: rgba(200, 0, 0, 0.45);
      pointer-events: none; z-index: 6;
      opacity: 0;
    }
    #damage-flash.active { animation: flash 0.35s ease-out forwards; }
    @keyframes flash {
      0%   { opacity: 1; }
      100% { opacity: 0; }
    }

    /* --- Game over --- */
    #gameover {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: white; z-index: 20;
    }
    #gameover.hidden { display: none; }
    #gameover h1 { font-size: 72px; color: #ff3333; margin-bottom: 24px; letter-spacing: 4px; }
    .go-stats {
      display: flex; flex-direction: column; align-items: center;
      gap: 10px; margin-bottom: 36px;
    }
    .go-stats p { font-size: 22px; color: #ccc; }
    .go-stats span { color: white; font-weight: bold; }
    #gameover button {
      font-size: 20px; padding: 14px 40px;
      background: #ff3333; color: white;
      border: none; cursor: pointer; border-radius: 6px;
      letter-spacing: 1px;
    }
    #gameover button:hover { background: #cc2222; }
  </style>
</head>
<body>
  <div id="blocker">
    <div id="start-menu">
      <h1>SHOTGAME</h1>
      <p class="subtitle">3D First-Person Shooter</p>
      <div class="controls-grid">
        <span>WASD</span>       <span style="color:#ccc">Rörelse</span>
        <span>Mus</span>        <span style="color:#ccc">Sikta</span>
        <span>Klick</span>      <span style="color:#ccc">Skjut</span>
        <span>Mellanslag</span> <span style="color:#ccc">Hoppa</span>
        <span>R</span>          <span style="color:#ccc">Ladda om</span>
        <span>M</span>          <span style="color:#ccc">Aktivera fiender</span>
      </div>
      <button id="start-btn">STARTA SPEL</button>
    </div>
    <div id="pause-menu" class="hidden">
      <h2>PAUSAD</h2>
      <p>Klicka för att fortsätta</p>
      <button id="restart-btn" onclick="location.reload()" style="margin-top:24px; font-size:17px; padding:12px 36px; background:#555; color:white; border:none; cursor:pointer; border-radius:6px; letter-spacing:1px;">Börja om</button>
    </div>
  </div>

  <div id="crosshair"></div>
  <div id="damage-flash"></div>

  <div id="gameover" class="hidden">
    <h1>GAME OVER</h1>
    <div class="go-stats">
      <p>Fiender träffade: <span id="final-score">0</span></p>
      <p>Överlevnadstid: <span id="final-time">00:00</span></p>
    </div>
    <button onclick="location.reload()">Spela igen</button>
  </div>

  <div id="hud">
    Träffar: <span id="score">0</span><br>
    Läge: <span id="mode">Statiskt</span> &nbsp;<small style="color:#aaa">[M] byt</small>
  </div>
  <div id="timer">00:00</div>
  <div id="bottom-right">
    <div id="hp-display">❤ <span id="hp">100</span>/100</div>
    <div id="ammo-display">&#128299; <span id="ammo">12</span>/12</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
