<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Shotgame</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }

    #blocker {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: white; cursor: pointer; z-index: 10;
    }
    #blocker h1 { font-size: 48px; margin-bottom: 16px; }
    #blocker p  { font-size: 20px; color: #ccc; }
    #blocker.hidden { display: none; }

    #crosshair {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none; z-index: 5;
    }
    #crosshair::before {
      content: ''; position: absolute;
      width: 2px; height: 16px;
      background: white; top: -8px; left: -1px;
    }
    #crosshair::after {
      content: ''; position: absolute;
      width: 16px; height: 2px;
      background: white; top: -1px; left: -8px;
    }

    #hud {
      position: fixed; top: 20px; left: 20px;
      color: white; font-size: 18px;
      text-shadow: 1px 1px 3px black;
      pointer-events: none; z-index: 5;
    }
  </style>
</head>
<body>
  <div id="blocker">
    <h1>SHOTGAME</h1>
    <p>Klicka för att spela &nbsp;|&nbsp; WASD = rörelse &nbsp;|&nbsp; Mus = sikta &nbsp;|&nbsp; Klick = skjut</p>
  </div>
  <div id="crosshair"></div>
  <div id="hud">
    Träffar: <span id="score">0</span><br>
    Läge: <span id="mode">Statiskt</span> &nbsp;<small style="color:#aaa">[M] byt</small>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
